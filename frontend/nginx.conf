server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A aplicação é uma SPA: qualquer rota desconhecida devolve o index.html,
    # senão recarregar a página em /chamados/1024 resultaria em 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API é servida pela mesma origem, o que evita CORS e permite que o
    # frontend use caminhos relativos (`/api/...`) em qualquer ambiente.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O fluxo SSE precisa passar sem buffer e sem timeout curto, senão os
        # eventos só chegariam em blocos ou a conexão cairia a cada minuto.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    # Swagger, para o avaliador testar a API pela mesma porta.
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
