services:
  mysql:
    image: mysql:8.4
    container_name: fadex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-central_chamados}
      MYSQL_USER: ${MYSQL_USER:-fadex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fadex}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # `-h 127.0.0.1` forca a checagem por TCP. Sem isso o mysqladmin responde
      # pelo socket local durante a inicializacao e o container e marcado como
      # saudavel antes de realmente aceitar conexoes da aplicacao.
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
