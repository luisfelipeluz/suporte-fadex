# =============================================================================
# Central de Chamados FADEX — stack completa
# =============================================================================
#   docker compose up --build
#
#   Aplicação ... http://localhost
#   Swagger ..... http://localhost/swagger-ui.html
# =============================================================================

services:
  mysql:
    image: mysql:8.4
    container_name: fadex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-central_chamados}
      MYSQL_USER: ${MYSQL_USER:-fadex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fadex}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # A porta do MySQL NAO e publicada no host de proposito: o backend fala com
    # o banco pela rede interna do compose, e muitas maquinas de desenvolvimento
    # ja tem um MySQL ocupando a 3306 — publicar aqui faria `docker compose up`
    # falhar nesses casos. Para inspecionar o banco de fora, descomente abaixo
    # (ajustando a porta se necessario):
    #
    # ports:
    #   - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # `-h 127.0.0.1` forca a checagem por TCP. Sem isso o mysqladmin responde
      # pelo socket local durante a inicializacao e o container e marcado como
      # saudavel antes de realmente aceitar conexoes da aplicacao.
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      # A PRIMEIRA subida inicializa o data dir do zero, e em Docker sobre WSL2
      # isso passa facilmente de dois minutos por causa da I/O de disco. Falhas
      # dentro do start_period nao contam como retry, entao esta janela larga
      # cobre a inicializacao sem mascarar um banco realmente quebrado depois.
      start_period: 240s

  backend:
    build:
      context: ./backend
    container_name: fadex-backend
    restart: unless-stopped
    depends_on:
      mysql:
        # Só sobe quando o MySQL aceita conexões de verdade, evitando o ciclo de
        # falha e reinício do Flyway na primeira execução.
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-central_chamados}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-fadex}
      DB_PASSWORD: ${MYSQL_PASSWORD:-fadex}
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-local-troque-este-segredo-com-no-minimo-32-bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-heuristic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    # Assim como o MySQL, a porta do backend NAO e publicada: o nginx do frontend
    # ja serve a API, o Swagger e o /v3/api-docs na mesma porta 80, e a 8080 e uma
    # das mais disputadas numa maquina de desenvolvimento (outro Spring, Tomcat,
    # Jenkins) — publicar aqui so criaria mais um jeito de `docker compose up`
    # falhar. Para bater direto no backend, descomente:
    #
    # ports:
    #   - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # A porta so passa a aceitar conexao depois que o Flyway migrou e o contexto
      # do Spring subiu, entao um teste de socket ja diz que a API esta pronta.
      # `bash` explicito porque /dev/tcp e uma extensao do bash: o /bin/sh do
      # Ubuntu e o dash, que nao entende essa sintaxe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      # O backend so comeca a subir depois do MySQL ficar saudavel; esta janela
      # cobre a partida da JVM mais as migrations do Flyway.
      start_period: 120s

  frontend:
    build:
      context: ./frontend
    container_name: fadex-frontend
    restart: unless-stopped
    depends_on:
      backend:
        # Esperar a API responder evita a janela em que a interface ja abre mas
        # toda chamada volta 502 — quem sobe o projeto pela primeira vez veria
        # uma tela de erro sem saber que era so aguardar.
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_PUBLICO:-80}:80"

volumes:
  mysql-data:
