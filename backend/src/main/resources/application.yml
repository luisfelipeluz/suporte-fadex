spring:
  application:
    name: central-chamados

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/central_chamados?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fadex}
    password: ${DB_PASSWORD:fadex}

  jpa:
    # `validate` garante que as entidades JPA e o schema criado pelo Flyway
    # nunca divirjam: a aplicacao se recusa a subir se estiverem fora de sincronia.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Instantes sao gravados em UTC e serializados em ISO-8601; a conversao
          # para o fuso do usuario acontece na interface.
          time_zone: UTC

  flyway:
    enabled: true
    # `db/demo` traz a carga de demonstracao (chamados de exemplo) e fica FORA do
    # perfil de teste: a suite roda apenas `db/migration`, sobre uma base limpa,
    # para que os testes nao dependam de dados de vitrine.
    locations: classpath:db/migration,classpath:db/demo

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    # Valor padrao APENAS para desenvolvimento local, para que o projeto suba
    # sem configuracao extra. Em qualquer outro ambiente defina JWT_SECRET.
    secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-com-no-minimo-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost}
  triage:
    # `heuristic` (padrao, sem dependencia externa) ou `gemini`
    provider: ${TRIAGE_PROVIDER:heuristic}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      timeout-seconds: 8

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    br.org.fadex.chamados: INFO
